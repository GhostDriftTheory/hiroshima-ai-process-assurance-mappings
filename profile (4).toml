  "形式証明はLeanの定義済みモデルを対象とします。観測値抽出、JSON・暗号・OS・入出力、Python全体の全入力に対する正しさは証明していません。",
  "ハッシュと再検証は発行者認証や署名ではなく、記録の再検証成立はHOLD・REJECTをPASSへ変更しません。",
  "他の自治体AI PoCとは独立です。相互の自動変換、統合運転又は複数Profileを合算した適合性は主張しません。",
  "Reporting v2ブリッジは証拠利用のガイドであり、完成報告書、提出手続、参加資格判定又は承認ではありません。",
