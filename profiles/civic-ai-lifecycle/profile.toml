title_en = "Civic AI Derived-Information Lifecycle Assurance Mapping"
publisher = "AI Assurance, Inc.（株式会社AIアシュアランス）"
published = true
public_claim_ja = "本プロファイルは、広島AIプロセスの11行動を分解し、合成の自治体相談情報に関する派生情報の条件承継・継続利用・管理範囲の業務利用終了について、一部の技術義務を版固定された公開参照実装、Lean4のモデル証明及び再計算可能な記録へ対応付け、その証拠から言える範囲を機械検証します。"
public_claim_en = "This profile represents all 11 Hiroshima AI Process actions, maps selected technical obligations for condition inheritance, continued use and scoped termination of business use of derived synthetic municipal information to a version-pinned public implementation, Lean 4 model proofs and replayable records, and machine-checks the limits of what that evidence can support."
non_claims_ja = [
  "G7、日本政府、OECD又はHAIPの公式プロジェクト、公式認証又は全面適合ではありません。",
  "独立第三者監査、本番運用準備、実在自治体への導入、実住民情報の処理又は実社会での効果を立証しません。",
  "Lean4の証明対象は定義した判定モデルです。全Python・JavaScript実装の全入力に対する同値性、AI文章の意味的正確性、認証、JSON、SHA-256又はI/Oの正当性の証明ではありません。",
  "利用終了は指定した管理ゲート経由の業務利用に限ります。媒体の物理消去、モデルへの影響除去、未知の管理外コピーの不存在、監査記録の消失又はAPI提供者内部の消去を証明しません。",
  "管理範囲の完全性は捕捉済みの管理実体と固定の読取り能力に基づくものです。管理外の経路を全域で発見する機能ではありません。",
  "条件、承認者及び操作結果は固定仕様・模擬承認によるものです。実在する権利者・承認者の真正性や個別案件の法令適合を認定しません。",
  "公開API記録の再計算はローカル記録の整合性検査です。応答ID及びローカルのハッシュは提供者の署名・発行者認証ではなく、OpenAIによる成果認証又は共同研究を意味しません。",
  "記録した起源・モデル識別子・ハッシュは、透かし、C2PA又は信頼できるAI生成コンテンツの出所認証を実装した証拠ではありません。",
  "第1・第2弾との自動スキーマ変換又は3件を統合した実行システムを提供するものではありません。",
  "Reporting v2ブリッジは証拠利用のガイドであり、質問票の複製、完成済み報告書、提出ワークフロー、参加資格判定又は承認ではありません。",
]
non_claims_en = [
  "It is not an official G7, Government of Japan, OECD or HAIP project, an official certification, or evidence of full compliance.",
  "It does not establish an independent third-party audit, production readiness, deployment in an actual municipality, processing of real resident data, or realised societal outcomes.",
  "Lean 4 proves the defined decision model, not all-input equivalence of the complete Python/JavaScript implementations, semantic accuracy of AI text, authentication, JSON, SHA-256 or I/O correctness.",
  "Termination concerns business use through specified management gates only. It does not prove physical erasure, removal of model influence, absence of unknown unmanaged copies, disappearance of audit records, or erasure inside the API provider.",
  "Inventory completeness is relative to captured managed entities and fixed read capabilities; this is not global discovery of unmanaged paths.",
  "Conditions, approvers and operation outcomes use a fixed specification and mock authorization. They do not authenticate actual rights holders or approvers or determine case-specific legal compliance.",
  "Replaying the published API record checks local consistency. Response identifiers and local hashes are not provider signatures or issuer authentication, and do not imply certification by or joint research with OpenAI.",
  "Recorded origins, model identifiers and hashes do not establish watermarking, C2PA or reliable authentication of AI-generated content origins.",
  "No automatic schema conversion with the first two PoCs or integrated runtime spanning all three is provided.",
  "The Reporting v2 bridge is evidence-use guidance, not a questionnaire replica, completed report, submission workflow, eligibility decision or approval.",
]
