profile_can_support_ja = "条件喪失、未承認変更、残存経路・未終結操作及び過大な終了主張に対する固定PoCの判定と試験を示せます。"
profile_can_support_en = "The fixed PoC provides decisions and tests addressing lost conditions, unapproved amendments, residual paths, unresolved operations and overbroad termination claims."
