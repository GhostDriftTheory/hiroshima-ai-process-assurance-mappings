question_ja = "報告を行う場合、どの実際のAIシステムと組織の役割を対象とするか。"
question_en = "If reporting, which actual AI system and organisational role are in scope?"
rule_ja = "合成データの1回のAPI実験だけから、組織の参加資格、全システムの対象範囲又は提供者の統制を推定しない。"
rule_en = "Do not infer organisational eligibility, complete system scope or provider controls from the single synthetic API experiment."

[[reporting.scope_checks]]
id = "SCOPE-TERMINATION"
question_ja = "報告で利用終了を述べる場合、管理対象、保持例外、未確認経路をどこまで特定するか。"
question_en = "If reporting termination, what managed objects, retention exceptions and unverified paths are specified?"
rule_ja = "このPoCの終了記録は指定したローカル管理ゲート経由の業務利用に限る。未知のコピー、物理消去及び提供者内部へ拡張しない。"
rule_en = "End records in this PoC cover business use through specified local management gates only; do not extend them to unknown copies, physical erasure or provider internals."

