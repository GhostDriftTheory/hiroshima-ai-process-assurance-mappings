[[obligations]]
id = "M-JD-A9-02"
obligation_id = "O-JD-A9-IMPACT"
haip_action_id = "HAIP-A9"
obligation_ja = "実際の利用者・地域・産業に対する便益、負の影響、公平性及び環境影響を評価する。"
obligation_en = "Assess actual user, regional, and industrial benefits, adverse impacts, fairness, and environmental effects."
applicability = "IN_SCOPE_ORGANISATIONAL"
assessment = "NOT_COVERED"
minimum_evidence_strength = 0
evidence_ids = []
supporting_evidence_ids = []
gaps = ["No field comparison, measured profit or workload reduction, emissions measurement, or stakeholder-impact evaluation is supplied."]
rationale_ja = "実データを使う共同実証と商用化判断は次段階であり、公開合成PoCの実証済み成果ではない。"
rationale_en = "Joint field evaluation using real data and commercial decisions are subsequent stages, not demonstrated results of the public synthetic PoC."

[[obligations]]
id = "M-JD-A10-01"
obligation_id = "O-JD-A10-METHOD"
haip_action_id = "HAIP-A10"
obligation_ja = "固定した条件と判定記録をPython・ブラウザで照合する再現可能な方法を、相互検証の技術資料として提供する。"
obligation_en = "Provide reproducible Python/browser checks of fixed conditions and decision records as technical material for cross-checking."
applicability = "IN_SCOPE_TECHNICAL"
assessment = "SUPPORTING_ONLY"
minimum_evidence_strength = 0
evidence_ids = []
supporting_evidence_ids = [
  "E-JD-CORE",
  "E-JD-UI",
  "E-JD-CASES",
  "E-JD-CI",
]
gaps = [
  "Two implementations of one fixed public format are not adoption of an international standard or interoperability across arbitrary companies and systems.",
]
rationale_ja = "134入力の記録照合と保存・読込を参照する。C社・D社の固定候補切替から、任意企業への汎用接続や追加費用の線形性は導かない。"
rationale_en = "Evidence covers 134 record comparisons and save/load checks. Switching between fixed candidates C/D does not establish universal integration or linear onboarding costs."

[[obligations]]
id = "M-JD-A10-02"
obligation_id = "O-JD-A10-STANDARDS"
haip_action_id = "HAIP-A10"
obligation_ja = "国際技術標準の策定への参加又は実運用での採用・相互運用性を確認する。"
obligation_en = "Demonstrate participation in international technical-standard development or operational adoption/interoperability."
applicability = "IN_SCOPE_ORGANISATIONAL"
assessment = "NOT_COVERED"
minimum_evidence_strength = 0
evidence_ids = []
supporting_evidence_ids = []
gaps = ["No standards-body participation, standards-conformance evaluation, or multi-organisation production interoperability evidence is supplied."]
rationale_ja = "公開JSON形式とHAIPとの対応付けを、国際標準への適合又は実装間相互運用性の認定に読み替えない。"
rationale_en = "A public JSON format and HAIP mapping do not constitute international-standard conformance or certified interoperability."

[[obligations]]
id = "M-JD-A11-01"
obligation_id = "O-JD-A11-DATA-QUALITY"
haip_action_id = "HAIP-A11"
obligation_ja = "固定合成モデルで未確認の数量・時刻・確認値をnullとして保持し、0・falseと混同せず、合成データ・模擬操作の利用範囲を検査する。"
obligation_en = "Preserve unknown quantities, times, and confirmation values as null, distinguish them from zero/false, and check synthetic-data and simulation scope within the fixed model."
applicability = "IN_SCOPE_TECHNICAL"
assessment = "DIRECT"
minimum_evidence_strength = 3
evidence_ids = [
  "E-JD-CORE",
  "E-JD-CASES",
  "E-JD-LEAN",
  "E-JD-CI",
]
supporting_evidence_ids = []
gaps = []
rationale_ja = "required_unknown・missing_quantity_not_pass及びR08が未確認・利用範囲を明示する。既知量だけで上限超過なら、別の未確認値があってもREJECTを保持する。"
rationale_en = "required_unknown, missing_quantity_not_pass, and R08 make unknown states and scope explicit. A known overload remains REJECT even when other values are unknown."

[[obligations]]
id = "M-JD-A11-02"
obligation_id = "O-JD-A11-DISCLOSURE"
haip_action_id = "HAIP-A11"
obligation_ja = "共有用要約を、固定条件で許可された参加者向けの識別情報と判定項目に限定し、開示条件違反時は要約出力を停止する。"
obligation_en = "Limit participant summaries to identifiers and decision fields permitted by the fixed disclosure policy, and block summary output on disclosure-policy violations."
applicability = "IN_SCOPE_TECHNICAL"
assessment = "DIRECT"
minimum_evidence_strength = 3
evidence_ids = [
  "E-JD-CORE",
  "E-JD-CASES",
  "E-JD-UI",
  "E-JD-CI",
]
supporting_evidence_ids = ["E-JD-README"]
gaps = []
rationale_ja = "R05とEngine.partner_summaryは許可項目だけを選別する。重量・採算・承認詳細を含む完全記録とは別形式であり、秘匿性・匿名性・推測防止をこの義務に含めない。"
rationale_en = "R05 and Engine.partner_summary select permitted fields only. This is distinct from full records containing weights, economics, and approvals; confidentiality, anonymity, and inference resistance are outside this obligation."

[[obligations]]
id = "M-JD-A11-03"
obligation_id = "O-JD-A11-REAL-DATA-IP"
haip_action_id = "HAIP-A11"
obligation_ja = "実企業データ・個人データの取得根拠、品質、秘密保持及び知的財産権の取扱いを確認する。"
obligation_en = "Establish lawful collection, quality, confidentiality, and intellectual-property handling for real company and personal data."
applicability = "IN_SCOPE_TECHNICAL"
assessment = "NOT_COVERED"
minimum_evidence_strength = 0
evidence_ids = []
supporting_evidence_ids = ["E-JD-README"]
gaps = ["No real-data rights clearance, personal-data assessment, anonymity/secret-preservation proof, or operational data-handling evidence is supplied."]
rationale_ja = "合成データ、固定の開示項目及び著作権表示は、実データの適法性や秘密保持の十分性を証明しない。"
rationale_en = "Synthetic data, fixed disclosure fields, and copyright notices do not establish lawful or sufficient protection of real data."

