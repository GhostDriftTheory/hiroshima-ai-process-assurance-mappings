public_claim_ja = "本プロファイルは、株式会社オンザリンクスと株式会社AIアシュアランスの共同PoCについて、広島AIプロセスの11行動を分解し、共同配送への追加参加条件、共同承認、引渡し、採算との分離及び記録再検証に関する一部技術義務を、版固定された実装・形式モデル・検査記録へ対応付け、証拠参照と主張境界の整合性を機械検証します。"
public_claim_en = "This profile represents all eleven HAIP actions and maps selected technical obligations from the joint PoC of 株式会社オンザリンクス and AI Assurance, Inc. to version-pinned implementation, formal-model, and test evidence for participation conditions, joint approvals, handoff, separation of economics from permission, and record replay. It machine-checks evidence-reference and claim-boundary consistency."
non_claims_ja = [
  "G7、日本政府、OECD又はHAIPの公式プロジェクト、全面適合認証又は規制承認ではありません。",
  "公開証拠は固定1ルートの合成データによる技術検証です。実企業の参加承認、配車・運行システムへの接続、実配送又は本番運用準備を示しません。",
  "形式証明は定義済みLeanモデルを対象とします。観測値抽出、JSON、SHA-256、OS・入出力及びPython・JavaScript全体の全入力に対する正しさを証明していません。",
  "SHA-256及び記録再検証は、電子署名、発行者・本人認証又は時刻認証ではありません。HOLD・REJECTの記録が再検証できてもPASS又は現在の利用許可にはなりません。",
  "模擬ゲートの再使用停止は使用状態を保持した範囲に限ります。状態永続化、複数端末間の排他又は実物流での迂回防止を示しません。",
  "採算・初期費用回収・工数は合成の仮定です。実測利益、実測工数削減、配送最適化性能、法的責任の確定又は事故防止率を示しません。",
  "共有用要約は固定項目の選別です。匿名性、秘密保持又は複数結果からの推測防止の証明ではありません。",
  "API実験の公開記録は選定された24合成ケースの補助証拠です。各API出力の個別Lean証明、API応答の外部認証又は今回のAPI再実行を意味しません。",
  "他Profileの証拠を合算した適合性や統合運転は主張しません。Reporting v2ブリッジは証拠利用のガイドであり、完成報告、提出手続、参加資格判定又は承認ではありません。",
]
non_claims_en = [
  "Not an official G7, Japanese-government, OECD, or HAIP project, full-compliance certification, or regulatory approval.",
  "Public evidence concerns technical checks on one fixed synthetic route, not real-company participation approval, dispatch-system integration, physical delivery, or production readiness.",
  "Formal proofs cover the defined Lean model, not observation extraction, JSON, SHA-256, OS/I/O, or all-input correctness of the complete Python and JavaScript implementations.",
  "Hashes and replay are not signatures, issuer or identity authentication, or trusted timestamps. Successful replay of HOLD/REJECT does not turn it into PASS or current permission.",
  "Duplicate-use blocking is limited to retained simulation state; persistence, multi-device exclusion, and prevention of bypass in actual logistics are not demonstrated.",
  "Economics, initial-cost recovery, and workload are synthetic assumptions, not measured profits or effort reductions, route-optimisation performance, legal-liability allocation, or accident-prevention rates.",
  "The participant summary selects fixed fields; it does not prove anonymity, confidentiality, or resistance to inference across multiple results.",
  "The published API experiment is supporting evidence for 24 selected synthetic cases, not individual Lean proofs of API outputs, externally authenticated API responses, or a new API run for this profile.",
  "No integrated operation or aggregated compliance with other profiles is claimed. The Reporting v2 bridge is evidence-use guidance, not a completed report, submission workflow, eligibility decision, or approval.",
]
