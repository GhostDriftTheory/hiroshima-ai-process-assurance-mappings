profile_can_support_ja = "成果物は、技術的な失敗地点の特定、安全側のチェーン停止、テスト・限界情報の公開及び評価者関係の開示を示しますが、組織ガバナンス又はインシデント管理運用を立証しません。"
profile_can_support_en = "The artifacts demonstrate technical failure localisation, a conservative chain-stop rule, public sharing of test and limitation material, and disclosure of the evaluator relationship. They do not establish organisational governance or incident-management operations."
organisation_must_add_ja = "責任あるガバナンス役割、エスカレーション権限、インシデント定義・窓口、対応・通知手順、教育、監督、法務・知財・プライバシーレビュー、記録保持及び開示可能な実運用例又は指標を追加する必要があります。"
organisation_must_add_en = "Provide accountable governance roles, escalation authority, incident definitions and channels, response and notification procedures, training, oversight, legal/IP/privacy review, record retention, and examples or metrics from actual operation where disclosure is appropriate."
illustrative_wording_ja = "PoCは最初の非RELEASE引渡しを記録し、後続の正常区間によってその失敗が隠れることを防ぐため、技術調査を補助できます。組織のインシデント責任、報告窓口、エスカレーション、教育及び規制当局への通知は本プロファイルでは立証されず、別のガバナンス記録に基づいて説明する必要があります。"
illustrative_wording_en = "The PoC records the first non-RELEASE handoff and prevents a later clean leg from masking that failure, which can support technical investigation. Organisational incident ownership, reporting channels, escalation, training, and regulatory notification are not evidenced by this profile and would need to be described from separate governance records."
do_not_infer_ja = "チェーン停止記録だけから、インシデント対応プログラム、当局報告、教育済み人員、経営監督又は全社的説明責任を推論してはいけません。"
do_not_infer_en = "Do not infer an incident-response programme, reporting to authorities, trained personnel, executive oversight, or organisation-wide accountability from the chain-stop trace alone."

[[reporting.sections]]
section_id = "RF2-S5"
section_number = 5
title_ja = "コンテンツ認証及び来歴管理の仕組み"
title_en = "Content authentication & provenance mechanisms"
bridge_status = "NO_PROFILE_COVERAGE"
haip_action_ids = ["HAIP-A7"]
supported_obligation_ids = []
known_gap_obligation_ids = ["O-A7-CONTENT-PROVENANCE"]
evidence_ids = []
profile_can_support_ja = "直接実装証拠はありません。本プロファイルは、判断記録・成果物のハッシュと、AI生成コンテンツを認証、表示、透かし付与又は来歴保存する機構とを明確に区別しています。"
profile_can_support_en = "No direct implementation evidence. The profile deliberately distinguishes decision-record and artifact hashes from mechanisms that authenticate, label, watermark, or preserve provenance for AI-generated content."
organisation_must_add_ja = "実際のAIシステム及びコンテンツ工程に基づき、利用者がAI生成コンテンツと接するか、どの表示・来歴機構を使うか、その技術的限界、適用範囲、相互運用性及び非適用の場合を回答する必要があります。"
organisation_must_add_en = "Answer from the actual AI system and content workflow: whether users interact with or receive AI-generated content, what labelling or provenance mechanisms are used, their technical limits, coverage, interoperability, and any cases in which the mechanisms do not apply."
illustrative_wording_ja = "本コールドチェーン判断保証プロファイルは、利用者向けAIコンテンツの生成又は認証を行わず、透かし又はコンテンツ来歴機構を実装していません。証明書のハッシュは選択された判断成果物を拘束するもので、コンテンツ認証統制として示してはいけません。本セクションは組織の実際のAIコンテンツシステムについて独立に回答します。"
illustrative_wording_en = "This cold-chain decision-assurance profile does not generate or authenticate user-facing AI content and does not implement watermarking or content-provenance mechanisms. Hashes in the certificate bind selected decision artifacts; they must not be presented as content-authentication controls. Any answer for this section is supplied independently for the organisation's actual AI content systems."
do_not_infer_ja = "SHA-256による成果物拘束、ルールセットダイジェスト又は判断追跡を、コンテンツ透かし、出所認証、C2PA型来歴又はAI生成表示と同一視してはいけません。"
do_not_infer_en = "Never treat SHA-256 artifact binding, ruleset digests, or decision traceability as content watermarking, origin authentication, C2PA-style provenance, or user disclosure of AI-generated content."

[[reporting.sections]]
section_id = "RF2-S6"
section_number = 6
title_ja = "AI安全性の向上及び社会的リスク軽減のための研究・投資"
title_en = "Research & investment to advance AI safety & mitigate societal risks"
bridge_status = "LIMITED_CONTEXT_INPUT"
haip_action_ids = ["HAIP-A8", "HAIP-A10"]
supported_obligation_ids = ["O-A8-SAFETY-RESEARCH", "O-A10-MACHINE-READABLE-PROFILE"]
known_gap_obligation_ids = ["O-A8-INVESTMENT-PROGRAMME", "O-A10-SDO-ADOPTION"]
evidence_ids = [
  "E-CC-REDTEAM",
  "E-CC-CERT",
  "E-EVAL-CORE",
  "E-PROFILE-VERIFIER",
]
profile_can_support_ja = "各リポジトリは、安全性・信頼性研究に関係するテスト方法、再現検証、限定された形式規則、機械可読マッピング及び明示的限界を公開する応用研究成果です。"
profile_can_support_en = "The repositories are public applied-research artifacts: they expose test methods, reproducible verification, bounded formal rules, machine-readable mappings, and explicit limitations relevant to safety and trustworthiness research."
organisation_must_add_ja = "実際の予算、人員、研究戦略、優先順位、連携、公開方針、継続投資、測定可能な成果及び正式な標準化活動への参加を追加する必要があります。"
organisation_must_add_en = "Describe actual budgets, staffing, research strategy, prioritisation, partnerships, publication policy, investment continuity, measurable outputs, and any formal standards-development participation."
illustrative_wording_ja = "応用研究成果の一つとして、再現可能なコールドチェーン保証PoC、レッドチーム形式シナリオ、ハッシュ拘束証明書及び機械可読なHAIP証拠マッピングを公開しました。これは特定の研究貢献を示しますが、組織的なAI安全投資プログラムの規模、継続性、人員又は予算を立証するものではありません。"
illustrative_wording_en = "As one applied research output, we published a reproducible cold-chain assurance PoC, red-team-style scenarios, a hash-bound certificate, and a machine-readable HAIP evidence mapping. This demonstrates a specific research contribution; it does not by itself evidence the scale, continuity, staffing, or budget of an organisational AI-safety investment programme."
do_not_infer_ja = "公開コードの存在だけから、継続的投資プログラム、正式な標準採用、外部研究検証又は全社的な安全研究成熟度を推論してはいけません。"
do_not_infer_en = "Do not infer a sustained investment programme, formal standard adoption, external research validation, or organisation-wide safety-research maturity from the existence of public code alone."

[[reporting.sections]]
section_id = "RF2-S7"
section_number = 7
title_ja = "人類及び世界全体の利益の推進"
title_en = "Advancing human and global interests"
bridge_status = "LIMITED_CONTEXT_INPUT"
haip_action_ids = ["HAIP-A9"]
supported_obligation_ids = ["O-A9-GLOBAL-HEALTH-CONTEXT"]
known_gap_obligation_ids = ["O-A9-LITERACY-COMMUNITY"]
evidence_ids = [
  "E-CC-README",
  "E-CC-CORE",
  "E-CC-SAMPLE-REJECT",
  "E-CC-SAMPLE-CHAINSTOP",
]
profile_can_support_ja = "対象ユースケースは、医薬品物流の強靱性と医療コールドチェーンにおける不安全な次工程移行の防止に実質的に関係します。本プロファイルが示すのは意図した機構であり、実現済みの健康・社会的効果ではありません。"
profile_can_support_en = "The selected use case is materially connected to resilient medicine logistics and preventing unsafe onward handoff in a medical cold chain. The profile shows the intended mechanism, not realised health or social impact."
organisation_must_add_ja = "公益目的、影響を受ける関係者、アクセシビリティ・人間監督、導入文脈、協議、実現又は期待される成果、測定方法、不利益とのトレードオフ、デジタルリテラシー活動及び便益を単に主張していないことの証拠を追加する必要があります。"
organisation_must_add_en = "Provide the public-interest objective, affected stakeholders, accessibility and human-oversight considerations, deployment context, consultation, realised or expected outcomes, measurement method, adverse trade-offs, digital-literacy work, and evidence that benefits are not merely asserted."
illustrative_wording_ja = "PoCは、不安全な継続が医薬品品質及び供給強靱性に影響し得る医療コールドチェーンの引渡し課題を対象とし、合成・ファイル入力上で安全側の技術判断機構を示します。廃棄削減、患者便益、アクセス、強靱性又は社会的価値については、別途の実測及び関係者証拠が必要です。"
illustrative_wording_en = "The PoC targets a medical cold-chain handoff problem in which unsafe continuation can affect medicine quality and supply resilience. It demonstrates a conservative technical decision mechanism on synthetic/file-based inputs. Claims about reduced spoilage, patient benefit, access, resilience, or social value require separate real-world measurement and stakeholder evidence."
do_not_infer_ja = "導入データ及び関係者証拠なしに、患者便益、廃棄削減、アクセス改善、グローバルヘルス効果、公平性、包摂性又は地域連携を実証済みと主張してはいけません。"
do_not_infer_en = "Do not claim demonstrated patient benefit, reduced waste, improved access, global-health impact, fairness, inclusion, or community engagement without deployment data and stakeholder evidence."
