[[obligations]]
id = "M-A1-01"
obligation_id = "O-A1-RISK-GATES"
haip_action_id = "HAIP-A1"
obligation_ja = "次の状態遷移を許可する前に引渡しリスクを評価し、必要証拠又は安全条件が満たされない場合に安全側の軽減措置を適用する。"
obligation_en = "Evaluate handoff risks before permitting onward state transition, and apply a fail-safe mitigation when required evidence or safety conditions fail."
applicability = "IN_SCOPE_TECHNICAL"
assessment = "DIRECT"
minimum_evidence_strength = 3
evidence_ids = [
  "E-CC-CORE",
  "E-CC-CERT",
  "E-CC-SAMPLE-REJECT",
  "E-CC-SAMPLE-CHAINSTOP",
]
supporting_evidence_ids = ["E-CC-README"]
gaps = []
rationale_ja = "固定された判定順序が証拠を先に検査し、致命的閾値超過を拒否し、最初の非RELEASE判定後にチェーンを停止する。証明書リプレイがその挙動を拘束する。"
rationale_en = "The fixed decision sequence checks evidence first, rejects fatal threshold breaches, and stops the chain after the first non-RELEASE outcome; certificate replay binds the behaviour."

