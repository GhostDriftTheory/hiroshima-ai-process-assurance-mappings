profile_can_support_ja = "公開リポジトリは、目的、判断状態、方法、選択された評価、固定されたソース版、既知の限界、非主張事項並びにEvaluation OSの別個の役割と関係上の限界を開示しています。"
profile_can_support_en = "The public repositories disclose purpose, decision states, methods, selected evaluations, fixed source versions, known limitations, non-claims, and the separate scope and relationship limits of Evaluation OS."
organisation_must_add_ja = "実際の高度AIシステム、その能力・限界、下流利用者向け情報、リリース別文書化手順、公開承認、更新慣行、重要変更及び安全に要約可能な非公開評価を追加する必要があります。"
organisation_must_add_en = "Describe the actual advanced AI system, its capabilities and limitations, downstream-user information, release-specific documentation process, disclosure approval, update practice, material changes, and any non-public evaluations that can be summarised safely."
illustrative_wording_ja = "コールドチェーン保証層について、想定用途、判断ロジック、テストシナリオ、既知の境界及び版固定された証拠を公開しています。また、Evaluation OSが限定された公開主張・公開証拠集合を検査するものであり、独立第三者監査ではなく戦略的パートナーが実施したことも開示しています。この文書はここで特定した保証成果物に関するもので、高度AIシステム全体の透明性報告ではありません。"
illustrative_wording_en = "We publish the cold-chain assurance layer's intended use, decision logic, test scenarios, known boundaries, and version-pinned evidence. We also disclose that Evaluation OS examines a bounded public claim-to-evidence universe and is conducted by a strategic partner rather than an independent third-party auditor. This documentation concerns the assurance artifacts identified here and must not be read as a complete transparency report for an advanced AI system."
do_not_infer_ja = "本マッピングをOECD報告書、HAIP公式実装、独立監査又は完全なモデル／システムカードと呼んではいけません。また、Evaluation OSの下限値を企業点、HAIP点又はコールドチェーン点へ読み替えてはいけません。"
do_not_infer_en = "Do not call the mapping an OECD report, official HAIP implementation, independent audit, or complete model/system card; do not convert the Evaluation OS lower bound into a company, HAIP, or cold-chain score."

