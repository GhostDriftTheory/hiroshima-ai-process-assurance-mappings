[reporting]
bridge_id = "haip-reporting-v2-coldchain-evidence-bridge.v0.3"
snapshot_date = "2026-09-01"
official_source_id = "SRC-OECD-HAIP-V2"
purpose_ja = "組織がHAIP Reporting Framework v2.0への回答を作成する際に、本プロファイルの公開技術成果を裏付け資料として使う範囲を限定して示すガイドです。"
purpose_en = "A bounded guide for using this profile's public technical outputs as supporting evidence when an organisation prepares its own HAIP Reporting Framework v2.0 response."
not_a_submission_tool_ja = "本ブリッジは、質問票の複製、参加資格若しくは対象範囲の判定、組織回答全体の作成、承認管理又は提出可能との判定を行うものではありません。"
not_a_submission_tool_en = "This bridge does not reproduce the questionnaire, determine eligibility or scope, draft a complete organisational response, manage approvals, or certify readiness for submission."

[[reporting.scope_checks]]
id = "SCOPE-AI-SYSTEM"
question_ja = "報告対象となる実際の高度AIシステムと、それに対する報告組織の役割を特定しているか。"
question_en = "Has the reporting organisation identified the actual advanced AI system covered by its report and its role in relation to that system?"
rule_ja = "決定論的なコールドチェーンPoC単独では、高度AIシステムが報告対象に含まれることを立証できません。"
rule_en = "The deterministic cold-chain PoC does not by itself establish that an advanced AI system is in scope."

[[reporting.scope_checks]]
id = "SCOPE-RELATIONSHIP"
question_ja = "本コールドチェーン保証層が、対象AIシステムの開発、導入、提供又はガバナンスに実質的に接続されているか。"
question_en = "Is the cold-chain assurance layer substantively connected to the development, deployment, provision, or governance of that in-scope AI system?"
rule_ja = "単なる周辺資料又は例示にとどまる場合、実装済み組織慣行の証拠ではなく研究上の参考資料としてのみ扱います。"
rule_en = "If the profile is merely adjacent or illustrative, cite it only as research context, not as evidence of implemented organisational practice."

[[reporting.scope_checks]]
id = "SCOPE-LIVE-QUESTION"
question_ja = "OECD公式ポータルに表示される、その時点の正確な役割別設問を確認したか。"
question_en = "Has the preparer checked the exact, current, role-routed question in the official OECD portal?"
rule_ja = "正本は公式ポータル及び公式案内であり、本ブリッジは証拠の使い方だけを補助します。"
rule_en = "The portal and official instructions are authoritative; this bridge supplies evidence-use guidance only."

[[reporting.scope_checks]]
id = "SCOPE-ORGANISATION-FACTS"
question_ja = "責任主体、ガバナンス、導入状況、インシデント、セキュリティ、投資及び成果に関する最新の組織事実を追加できるか。"
question_en = "Can the organisation add current facts about ownership, governance, deployment, incidents, security, investment, and outcomes?"
rule_ja = "技術プロファイルは組織保有事実の代わりにはならず、公開回答には機密情報又は専有情報を含めてはなりません。"
rule_en = "Technical profile evidence cannot substitute for organisation-owned facts, and public responses must exclude confidential or proprietary information."

