section_id = "RF2-S1"
section_number = 1
title_ja = "リスクの特定及び評価"
title_en = "Risk identification and evaluation"
bridge_status = "TECHNICAL_EVIDENCE_INPUT"
haip_action_ids = ["HAIP-A1", "HAIP-A11"]
