profile_can_support_ja = "PoCは、順序付けられた安全側判定、最初の失敗地点でのチェーン停止、不正入力の拒否、プロファイル・ルールセット拘束、ハッシュによる成果物検査及びCI上の再現検証を実装しています。"
profile_can_support_en = "The PoC implements ordered fail-safe dispositions, first-failure chain stop, malformed-input rejection, profile/ruleset binding, hash-bound artifact checks, and reproducible verification in continuous integration."
organisation_must_add_ja = "本番IAM、秘密情報・インフラ統制、データ保護、脆弱性管理、インシデント対応、事業継続、アクセスレビュー、供給者統制及びHOLD又はREJECTを受け入れ若しくは解除する権限主体を説明する必要があります。"
organisation_must_add_en = "Describe production IAM, secrets and infrastructure controls, data protection, vulnerability management, incident response, business continuity, access review, supplier controls, and the governance authority that can accept or override a hold or rejection."
illustrative_wording_ja = "PoC内では、証拠欠落、矛盾入力又は閾値超過に対して黙って継続せず、限定された安全側状態を出します。また、証明書とCI検査により選択された判断成果物の変更を検出します。本番のセキュリティ、アクセス制御、監視及びインシデント対応は公開PoCの対象外であり、別途説明が必要です。"
illustrative_wording_en = "Within the PoC, missing evidence, contradictory inputs, or threshold breaches produce bounded fail-safe states rather than silent continuation; the certificate and CI checks detect changes to selected decision artifacts. Production security, access control, monitoring, and incident response are outside this public PoC and must be described separately."
do_not_infer_ja = "PoCを、本番グレードのサイバーセキュリティ、エンドツーエンドのデータ真正性、プライバシー準拠、脆弱性管理プログラム又は全社リスク管理システムと表現してはいけません。"
do_not_infer_en = "Do not describe the PoC as production-grade cybersecurity, end-to-end data authenticity, privacy compliance, a vulnerability-management programme, or an organisation-wide risk-management system."

