]
known_gap_obligation_ids = [
  "O-A1-INDEPENDENT-EXTERNAL-TESTING",
  "O-A1-FULL-LIFECYCLE-CHECKPOINTS",
  "O-A11-LEGAL-COMPLIANCE",
]
evidence_ids = [
  "E-CC-README",
  "E-CC-CORE",
  "E-CC-TESTS",
  "E-CC-REDTEAM",
  "E-CC-CERT",
  "E-CC-SAMPLE-REJECT",
  "E-CC-SAMPLE-CHAINSTOP",
]
profile_can_support_ja = "限定されたPoCについて、引渡し前の証拠・温度リスクゲート、厳格な入力検査、再実行可能なテスト、レッドチーム形式シナリオ、判断追跡及び次状態への遷移前の安全側判定を示せます。"
profile_can_support_en = "The bounded PoC defines pre-handoff evidence and temperature-risk gates, strict input checks, replayable test cases, red-team-style scenarios, decision traceability, and fail-safe outcomes before onward transition."
organisation_must_add_ja = "対象AIシステム、リスク分類、重要リスクの責任者、評価頻度、外部又は独立評価、本番ライフサイクルの範囲、導入実績及び適用法令・業界レビューを追加する必要があります。"
organisation_must_add_en = "Identify the in-scope AI system, risk taxonomy, material risk owners, assessment cadence, external or independent evaluation, production lifecycle coverage, deployment evidence, and applicable legal or sectoral review."
illustrative_wording_ja = "公開した2〜8℃引渡しPoCでは、証拠完備性及び温度ルールの検査を明示し、再実行可能なテストとレッドチーム形式シナリオで確認し、最初の非RELEASE区間で停止するよう構成しました。この結果はファイルベースPoCに限定され、全社又は本番のリスク管理を立証するものではありません。"
illustrative_wording_en = "For the published 2–8°C handoff PoC, we defined explicit evidence-completeness and temperature-rule checks, exercised them through replayable tests and red-team-style scenarios, and configured the workflow to stop at the first non-RELEASE leg. These results are limited to the file-based PoC and do not establish enterprise-wide or production risk management."
do_not_infer_ja = "独立外部評価、継続的な本番監視、規制準拠、製品別閾値の妥当性又は上流センサーデータの真正性を推論してはいけません。"
do_not_infer_en = "Do not infer independent external testing, continuous production monitoring, regulatory compliance, validated product thresholds, or authenticity of upstream sensor data."

